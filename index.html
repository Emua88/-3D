<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Physics Arc 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="topbar">
      <div class="brand">PHYSICS ARC <span>3D</span></div>
      <div class="stats">
        <b id="level">LEVEL 01</b>
        <span>SHOTS <strong id="shots">● ● ●</strong></span>
        <span>STARS <strong id="stars">☆☆☆</strong></span>
      </div>
    </div>
    <div id="objective"></div>
    <div id="status"></div>
    <div class="controls">
      <button id="restart">RESTART</button>
      <button id="next">NEXT LEVEL</button>
      <button id="camera">CAMERA: FREE</button>
    </div>
    <div id="help">WASD / QE: 이동 · 마우스 드래그: 카메라 · 휠: 줌 · 발사 전 공을 드래그해 방향/힘 조절 · SPACE: 발사</div>
  </div>
  <div id="start">
    <div class="panel">
      <h1>PHYSICS ARC <span>3D</span></h1>
      <p>3차원 공간에서 포물선과 반사를 이용해 링을 통과시키세요.</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
