<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Physics Arc 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="topbar">
      <div class="brand">PHYSICS ARC <span>3D</span></div>
      <div class="stats">
        <b id="level">LEVEL 01</b>
        <span>SHOTS <strong id="shots">● ● ●</strong></span>
        <span>STARS <strong id="stars">☆☆☆</strong></span>
      </div>
    </div>
    <div id="objective"></div>
    <div id="status"></div>
    <div class="controls">
      <button id="restart">RESTART</button>
      <button id="next">NEXT LEVEL</button>
      <button id="camera">CAMERA: FREE</button>
    </div>
    <div id="help">← →: 카메라 좌우 회전 · ↑ ↓: 카메라 위/아래 회전 · 공에서 마우스 드래그: 방향/힘 조절 · SPACE: 발사 · R: 재시작</div>
  </div>
  <div id="start">
    <div class="panel">
      <h1>PHYSICS ARC <span>3D</span></h1>
      <div class="start-help">
        <p>🎯 목표: 공을 포물선으로 발사해 링을 통과시키세요.</p>
        <p>🖱️ 공에서 원하는 방향으로 드래그: 발사 방향과 힘 조절 (자동으로 큰 포물선)</p>
        <p>⌨️ SPACE: 발사 · R: 재시작</p>
        <p>📷 ← → ↑ ↓: 카메라 회전 (마우스 회전 없음)</p>
      </div>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
